# Retention policy for the DASI store. Every setting is optional.
# When free disk space is below min_free_percent, retention wipes whole databases, longest
# idle first (last read or write, as recorded by FDB), until the target is met.
# Databases with no recorded access are never wiped.
min_free_percent: 0      # 0 or omitted: disabled. e.g. 20 wipes while free disk is below 20%
min_idle_days: 30        # default 30: never wipe databases read or written within this many days
delete_size_gb: 5        # default unlimited: stop a run once this many GiB have been wiped
