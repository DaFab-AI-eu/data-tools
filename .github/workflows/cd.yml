name: CD

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Derive data-tools version from tag
        run: echo "DATA_TOOLS_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build runtime image
        run: |
          docker build \
            --target runtime \
            --tag "data-tools:${DATA_TOOLS_VERSION}" \
            .

      - name: Smoke-test runtime image
        run: docker run --rm "data-tools:${DATA_TOOLS_VERSION}" python -c 'import pydafab'

      - name: Tag and push to GHCR
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker tag "data-tools:${DATA_TOOLS_VERSION}" "$tag"
            docker push "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"