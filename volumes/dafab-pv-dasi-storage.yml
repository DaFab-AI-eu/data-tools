apiVersion: v1
kind: PersistentVolume
metadata:
  name: dasi-pv-storage
  labels:
    type: dasi-storage
spec:
  capacity:
    storage: 480Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: dasi-storage
  local:
    path: /mnt/dasi
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - knot
