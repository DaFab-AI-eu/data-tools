apiVersion: v1
kind: PersistentVolume
metadata:
  name: dasi-pv-tools
  labels:
    type: dasi-tools
spec:
  capacity:
    storage: 10Mi
  volumeMode: Filesystem
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: dasi-storage
  local:
    path: /mnt/dasi/tools
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - knot
