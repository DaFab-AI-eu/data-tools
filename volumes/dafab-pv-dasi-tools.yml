apiVersion: v1
kind: PersistentVolume
metadata:
  name: dasi-pv-tools
  labels:
    type: dasi-tools
spec:
  capacity:
    storage: 10Mi
  volumeMode: Filesystem
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: dasi-storage
  nfs:
    path: /mnt/store/nfs/files/private/dafab/dasi/tools
    server: 10.40.11.18